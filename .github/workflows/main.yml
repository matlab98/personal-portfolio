name: CI Pipeline

on:
  pull_request:
    branches:
      - DEV

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    # npm ci cuando el lockfile vuelva a estar en sync con package.json.
    - name: Install dependencies
      run: npm install --no-audit --no-fund

    - name: Lint
      run: npm run lint

    - name: Build
      run: npm run build

    # Vitest no se pudo instalar en local (registry inalcanzable); el runner de CI sí
    # tiene red, así que esta es la primera ejecución real de la suite.
    - name: Test
      run: npm test
