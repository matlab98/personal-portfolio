name: CI/CD Pipeline

on:
  pull_request:
    branches:
      - DEV

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18.13.0'

    - name: Install dependencies
      run: npm install

    - name: Run tests
      run: npm test

    - name: Build
      run: npm run build

    - name: Deploy
      env:
        NODE_ENV: production
        DEPLOYMENT_KEY: ${{ secrets.DEPLOYMENT_KEY }}
      run: npm run deploy
